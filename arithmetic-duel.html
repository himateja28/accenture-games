<body class="game-page">
  <div class="game-shell">

    <!-- top bar -->
    <div class="game-topbar">
      <a class="back-btn" href="index.html" id="back-home">&larr; Lobby</a>
      <div class="score-chip">Score&nbsp;<strong id="total-score">0</strong></div>
    </div>

    <!-- game card -->
    <div class="arith-card" id="arith-card">

      <!-- status row -->
      <div class="arith-status">
        <div class="arith-stat">
          <span class="arith-stat-label">Time</span>
          <span class="arith-stat-value danger" id="time-display">15</span>
        </div>
        <div class="arith-stat">
          <span class="arith-stat-label">Question</span>
          <span class="arith-stat-value" id="q-num">1</span>
        </div>
        <div class="arith-stat">
          <span class="arith-stat-label">Streak</span>
          <span class="arith-stat-value warning" id="streak-display">0</span>
        </div>
        <div class="arith-stat">
          <span class="arith-stat-label">Lives</span>
          <span class="arith-stat-value" id="lives-display">❤️❤️❤️</span>
        </div>
      </div>

      <!-- timer bar -->
      <div class="arith-timer-bar-wrap">
        <div class="arith-timer-bar" id="timer-bar" style="width:100%"></div>
      </div>

      <!-- PLAY STATE -->
      <div id="play-state">
        <!-- question -->
        <div class="arith-question-area">
          <span class="arith-level-tag" id="level-tag">Level 1</span>
          <h1 class="arith-question" id="question-text" style="font-size:clamp(2.2rem, 7vw, 3.6rem);">8 + 7</h1>
          <div class="arith-instruction">Select the correct answer</div>
        </div>

        <!-- options -->
        <div class="arith-options" id="options-grid">
          <button class="arith-option" id="opt-0" type="button"></button>
          <button class="arith-option" id="opt-1" type="button"></button>
          <button class="arith-option" id="opt-2" type="button"></button>
          <button class="arith-option" id="opt-3" type="button"></button>
        </div>

        <!-- feedback -->
        <div class="arith-feedback" id="feedback">Pick the correct answer before time runs out!</div>

        <!-- controls -->
        <div class="arith-controls">
          <button class="btn-ghost" id="btn-restart" type="button">Restart</button>
          <button class="btn-ghost" id="btn-skip" type="button">Skip (−50)</button>
        </div>
      </div>

      <!-- RESULT STATE (hidden initially) -->
      <div id="result-state" style="display:none">
        <div class="arith-result">
          <h2 id="result-heading">Round Complete!</h2>
          <div class="result-score" id="result-score-val">0</div>
          <div class="result-sub" id="result-sub">Here's how you did</div>
          <div class="result-stats">
            <div class="result-stat">
              <span class="rs-val" id="rs-correct">0</span>
              <span class="rs-lbl">Correct</span>
            </div>
            <div class="result-stat">
              <span class="rs-val" id="rs-wrong">0</span>
              <span class="rs-lbl">Wrong</span>
            </div>
            <div class="result-stat">
              <span class="rs-val" id="rs-streak">0</span>
              <span class="rs-lbl">Best Streak</span>
            </div>
            <div class="result-stat">
              <span class="rs-val" id="rs-accuracy">0%</span>
              <span class="rs-lbl">Accuracy</span>
            </div>
          </div>
          <div style="display:flex;gap:12px;justify-content:center">
            <button class="btn-primary" id="btn-play-again" type="button">Play Again</button>
            <a class="btn-ghost" href="index.html" id="btn-lobby">Back to Lobby</a>
          </div>
        </div>
      </div>

    </div><!-- /arith-card -->
  </div><!-- /game-shell -->

  <script>
/* ============================================================
   ARITHMETIC DUEL — Game Engine
   ============================================================ */
const TOTAL_QUESTIONS = 10;
const LEVEL_THRESHOLDS = [0, 1, 3, 6, 8, 10];

const state = {
  score: 0,
  qIndex: 0,
  streak: 0,
  bestStreak: 0,
  lives: 3,
  correct: 0,
  wrong: 0,
  timeLeft: 15,
  maxTime: 15,
  timer: null,
  locked: false,
  answer: null,
  done: false,
};

const $ = id => document.getElementById(id);
const timeDisplay  = $('time-display');
const qNum         = $('q-num');
const streakDisplay= $('streak-display');
const livesDisplay = $('lives-display');
const timerBar     = $('timer-bar');
const levelTag     = $('level-tag');
const questionText = $('question-text');
const optBtns      = [0,1,2,3].map(i => $('opt-' + i));
const feedback     = $('feedback');
const totalScore   = $('total-score');
const playState    = $('play-state');
const resultState  = $('result-state');

function ri(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function getLevel(qIdx) {
  if (qIdx >= 8) return 5;
  if (qIdx >= 6) return 4;
  if (qIdx >= 5) return 3;
  if (qIdx >= 3) return 2;
  return 1;
}

function generateQuestion(level) {
  const ops = {
    1: () => { const a=ri(2,15), b=ri(2,15); return { expr:`${a} + ${b}`, ans:a+b }; },
    2: () => { const a=ri(10,50), b=ri(2,20); return { expr:`${a+b} − ${b}`, ans:a }; },
    3: () => {
      const type = ri(1,3);
      if (type===1) { const a=ri(2,12),b=ri(2,9); return { expr:`${a} × ${b}`, ans:a*b }; }
      if (type===2) { const b=ri(2,9),a=ri(2,10); return { expr:`${a*b} ÷ ${b}`, ans:a }; }
      const a=ri(15,60),b=ri(5,25); return { expr:`${a} + ${b}`, ans:a+b };
    },
    4: () => {
      const type = ri(1,2);
      if (type===1) { const a=ri(5,15),b=ri(5,12),c=ri(2,9); return { expr:`${a} × ${b} − ${c}`, ans:a*b-c }; }
      const a=ri(10,30),b=ri(5,20),c=ri(2,8); return { expr:`(${a} + ${b}) × ${c}`, ans:(a+b)*c };
    },
    5: () => {
      const type = ri(1,3);
      if (type===1) { const a=ri(10,20),b=ri(8,15); return { expr:`${a}² − ${b}²`, ans:a*a-b*b }; }
      if (type===2) { const a=ri(5,15),b=ri(3,12),c=ri(2,6); return { expr:`${a} × ${b} + ${c} × ${c}`, ans:a*b+c*c }; }
      const a=ri(100,200),b=ri(4,10); return { expr:`${a*b} ÷ ${b}`, ans:a };
    },
  };
  const gen = ops[level] || ops[1];
  return gen();
}

function makeOptions(answer, level) {
  const opts = new Set([answer]);
  const range = level <= 2 ? 10 : level <= 3 ? 20 : 50;
  while (opts.size < 4) {
    let v = answer + ri(-range, range);
    if (v !== answer && v > 0) opts.add(v);
  }
  return shuffle([...opts]);
}

function updateLives() {
  livesDisplay.textContent = '❤️'.repeat(Math.max(0, state.lives)) + '🖤'.repeat(Math.max(0, 3 - state.lives));
}

function updateScore() {
  totalScore.textContent = state.score;
}

function setFeedback(msg, cls = '') {
  feedback.textContent = msg;
  feedback.className = 'arith-feedback' + (cls ? ' ' + cls : '');
}

function updateTimerBar() {
  const pct = (state.timeLeft / state.maxTime) * 100;
  timerBar.style.width = pct + '%';
  timerBar.classList.toggle('urgent', state.timeLeft <= 5);
  timeDisplay.classList.toggle('danger', state.timeLeft <= 5);
}

function clearTimer() { clearInterval(state.timer); state.timer = null; }

function startTimer() {
  clearTimer();
  updateTimerBar();
  state.timer = setInterval(() => {
    state.timeLeft--;
    timeDisplay.textContent = state.timeLeft;
    updateTimerBar();
    if (state.timeLeft <= 0) {
      clearTimer();
      onTimeUp();
    }
  }, 1000);
}

function onTimeUp() {
  if (state.locked) return;
  state.locked = true;
  state.streak = 0;
  streakDisplay.textContent = 0;
  state.wrong++;
  state.score = Math.max(0, state.score - 100);
  updateScore();
  state.lives--;
  updateLives();
  setFeedback('⏰ Time\'s up! The answer was ' + state.answer, 'wrong-fb');
  optBtns.forEach(b => {
    if (Number(b.textContent) === state.answer) b.classList.add('correct');
    b.disabled = true;
  });
  if (state.lives <= 0) {
    setTimeout(showResult, 1200);
  } else {
    setTimeout(nextQuestion, 1400);
  }
}

function loadQuestion() {
  state.locked = false;
  const level = getLevel(state.qIndex);
  state.maxTime = Math.max(6, 18 - (level - 1) * 2);
  state.timeLeft = state.maxTime;

  levelTag.textContent = 'Level ' + level;
  qNum.textContent = state.qIndex + 1;
  streakDisplay.textContent = state.streak;

  const { expr, ans } = generateQuestion(level);
  state.answer = ans;
  questionText.textContent = expr + ' = ?';

  const opts = makeOptions(ans, level);
  optBtns.forEach((btn, i) => {
    btn.textContent = opts[i];
    btn.className = 'arith-option';
    btn.disabled = false;
  });

  setFeedback('Select the correct answer before time runs out!');
  updateTimerBar();
  timeDisplay.textContent = state.timeLeft;
  startTimer();
}

function nextQuestion() {
  state.qIndex++;
  if (state.qIndex >= TOTAL_QUESTIONS || state.lives <= 0) {
    showResult();
  } else {
    loadQuestion();
  }
}

function handleAnswer(btn) {
  if (state.locked) return;
  clearTimer();
  state.locked = true;

  const chosen = Number(btn.textContent);
  const isCorrect = chosen === state.answer;

  optBtns.forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add('correct');
    state.correct++;
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    streakDisplay.textContent = state.streak;

    const timeBonus = Math.round(state.timeLeft * 8);
    const streakBonus = state.streak >= 3 ? state.streak * 15 : 0;
    const pts = 100 + timeBonus + streakBonus;
    state.score += pts;
    updateScore();

    let msg = `✅ Correct! +${pts} pts`;
    if (streakBonus > 0) msg += ` (🔥 Streak ×${state.streak})`;
    setFeedback(msg, 'correct-fb');
  } else {
    btn.classList.add('wrong');
    optBtns.forEach(b => { if (Number(b.textContent) === state.answer) b.classList.add('correct'); });
    state.streak = 0;
    streakDisplay.textContent = 0;
    state.wrong++;
    state.lives--;
    updateLives();
    state.score = Math.max(0, state.score - 50);
    updateScore();
    setFeedback('❌ Wrong! The answer was ' + state.answer, 'wrong-fb');
  }

  if (state.lives <= 0) {
    setTimeout(showResult, 1200);
    return;
  }

  const delay = isCorrect ? 900 : 1400;
  setTimeout(nextQuestion, delay);
}

function showResult() {
  clearTimer();
  state.done = true;
  playState.style.display = 'none';
  resultState.style.display = 'block';

  const total = state.correct + state.wrong;
  const accuracy = total > 0 ? Math.round((state.correct / total) * 100) : 0;

  $('result-score-val').textContent = state.score;
  $('rs-correct').textContent = state.correct;
  $('rs-wrong').textContent = state.wrong;
  $('rs-streak').textContent = state.bestStreak;
  $('rs-accuracy').textContent = accuracy + '%';
  $('result-heading').textContent = state.score >= 800 ? '🎉 Excellent!' : state.score >= 500 ? '👍 Good Job!' : '💪 Keep Practising!';
  $('result-sub').textContent = `${state.correct} correct answers out of ${total} questions`;
  totalScore.textContent = state.score;
}

function restartGame() {
  Object.assign(state, {
    score: 0, qIndex: 0, streak: 0, bestStreak: 0,
    lives: 3, correct: 0, wrong: 0, locked: false, done: false,
  });
  updateScore();
  updateLives();
  playState.style.display = 'block';
  resultState.style.display = 'none';
  loadQuestion();
}

optBtns.forEach(btn => btn.addEventListener('click', () => handleAnswer(btn)));
$('btn-restart').addEventListener('click', restartGame);

$('btn-skip').addEventListener('click', () => {
  if (state.locked || state.done) return;
  clearTimer();
  state.score = Math.max(0, state.score - 50);
  updateScore();
  state.streak = 0;
  streakDisplay.textContent = 0;
  setFeedback('Skipped. The answer was ' + state.answer);
  optBtns.forEach(b => { if (Number(b.textContent) === state.answer) b.classList.add('correct'); b.disabled = true; });
  state.locked = true;
  setTimeout(nextQuestion, 1200);
});

$('btn-play-again').addEventListener('click', restartGame);

document.addEventListener('keydown', e => {
  const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3 };
  if (keyMap[e.key] !== undefined && !state.locked && !state.done) {
    handleAnswer(optBtns[keyMap[e.key]]);
  }
});

updateLives();
loadQuestion();
  </script>
